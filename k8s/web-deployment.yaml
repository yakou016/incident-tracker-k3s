apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: web
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: web
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: web
    spec:
      containers:
        - env:
            - name: FLASK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: FLASK_SECRET_KEY
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
          envFrom:
            - configMapRef:
                name: env
          image: docker.io/library/week-4-web:latest
          imagePullPolicy: IfNotPresent
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - import urllib.request; urllib.request.urlopen('http://localhost:5000')
            failureThreshold: 5
            periodSeconds: 10
            timeoutSeconds: 5
          name: web
          ports:
            - containerPort: 5000
              protocol: TCP
      restartPolicy: Always
